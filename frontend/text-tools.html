<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>텍스트 도구 · PDF 페이지 편집기</title>
  <link rel="stylesheet" href="text-tools.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><span>↔</span><div>텍스트 도구<small>LOCAL TEXT UTILITY</small></div></a>
    <nav><a href="index.html">PDF 편집기</a><a href="sql-builder.html">SQL 만들기</a><a href="arcade.html">몽글 아케이드</a></nav>
  </header>
  <main>
    <section class="intro">
      <div><p class="eyebrow">TEXT WORKBENCH</p><h1>문장을 다듬고, 차이를 정확하게.</h1><p>입력한 내용은 서버로 전송하지 않고 현재 브라우저에서만 처리합니다.</p></div>
      <div class="tabs" role="tablist"><button id="case-tab" role="tab" aria-selected="true">대·소문자 변환</button><button id="diff-tab" role="tab" aria-selected="false">텍스트 비교</button></div>
    </section>

    <section id="case-panel" class="workspace" role="tabpanel">
      <div class="panel">
        <div class="panel-head"><h2>원본 텍스트</h2><button class="quiet" data-clear="case-input">비우기</button></div>
        <textarea id="case-input" spellcheck="false" placeholder="변환할 텍스트를 붙여 넣으세요."></textarea>
        <div id="input-stats" class="stats">0자 · 0단어 · 0줄</div>
      </div>
      <div class="panel">
        <div class="panel-head"><h2>변환 결과</h2><button id="copy-case" class="primary">결과 복사</button></div>
        <div class="case-actions" aria-label="변환 방식">
          <button data-case="upper">모두 대문자</button><button data-case="lower">모두 소문자</button>
          <button data-case="title">단어 첫 글자</button><button data-case="sentence">문장 첫 글자</button>
          <button data-case="swap">대·소문자 반전</button><button data-case="trim">공백 정리</button>
        </div>
        <textarea id="case-output" spellcheck="false" placeholder="변환 결과가 여기에 표시됩니다."></textarea>
        <div id="output-stats" class="stats">0자 · 0단어 · 0줄</div>
      </div>
    </section>

    <section id="diff-panel" role="tabpanel" hidden>
      <div class="compare-toolbar">
        <div class="options"><label><input id="ignore-case" type="checkbox"> 대소문자 무시</label><label><input id="ignore-space" type="checkbox"> 공백 차이 무시</label><label><input id="ignore-blank" type="checkbox"> 빈 줄 무시</label></div>
        <div class="diff-nav"><button id="toggle-same" aria-pressed="false">동일 줄 숨기기</button><button id="prev-diff">↑ 이전 차이</button><strong id="diff-count">차이 0개</strong><button id="next-diff">다음 차이 ↓</button><button id="run-diff" class="primary">지금 비교</button></div>
      </div>
      <div class="compare-inputs">
        <div class="panel"><div class="panel-head"><h2>원본</h2><div><button id="left-to-right">오른쪽으로 복사 →</button><button class="quiet" data-clear="left-input">비우기</button></div></div><textarea id="left-input" spellcheck="false" placeholder="원본 텍스트"></textarea></div>
        <div class="panel"><div class="panel-head"><h2>변경본</h2><div><button id="right-to-left">← 왼쪽으로 복사</button><button class="quiet" data-clear="right-input">비우기</button></div></div><textarea id="right-input" spellcheck="false" placeholder="변경된 텍스트"></textarea></div>
      </div>
      <div class="diff-result panel">
        <div class="panel-head"><div><h2>비교 결과</h2><p>빨강은 삭제, 초록은 추가, 노랑은 변경된 글자를 뜻합니다.</p></div><button id="save-diff">TXT 저장</button></div>
        <div class="diff-columns"><strong>원본</strong><strong>변경본</strong></div>
        <div id="diff-rows" class="diff-rows"><div class="empty">좌우에 텍스트를 입력하면 차이를 바로 확인할 수 있습니다.</div></div>
      </div>
    </section>
  </main>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <script src="text-tools-core.js"></script><script src="text-tools.js"></script>
</body>
</html>
